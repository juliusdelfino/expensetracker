spring:
  config:
    import: "optional:classpath:country-mapping.yml"
  datasource:
    # Replaced by embedded PostgreSQL via @AutoConfigureEmbeddedDatabase in BaseControllerTest
    url: jdbc:postgresql://localhost:5432/expensetracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    ollama:
      base-url: http://127.0.0.1:1
      chat:
        enabled: true
    openai:
      api-key: test-key   # required to prevent "API key must be set" from auto-configurations
      base-url: http://127.0.0.1:1
      chat:
        enabled: true
      image:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
      embedding:
        enabled: false
    mcp:
      server:
        name: expense-tracker-mcp-test
        version: 1.0.0
    # Disable Spring AI retry backoff so WireMock connection errors fail fast
    retry:
      max-attempts: 1

server:
  servlet:
    session:
      timeout: 1h

app:
  migration:
    enabled: false
  data:
    dir: target/test-data
  ai:
    defaults:
      chat-model: gemma4:latest
      ocr-model: gemma4:latest
    quotas:
      chat-monthly: 2
      ocr-monthly: 2
    providers:
      ollama:
        ocr-url: http://127.0.0.1:1/api/chat
      openai:
        ocr-url: http://127.0.0.1:1/v1/chat/completions
    models:
      - id: gemma4:latest
        label: Gemma 4 (Ollama)
        provider: OLLAMA
        supports-chat: true
        supports-ocr: true
      - id: qwen3.5-397b-a17b
        label: Qwen 3.5 (OpenAI)
        provider: OPENAI
        supports-chat: true
        supports-ocr: true

# Fast-fail invalid URL to prevent real HTTP currency calls
currency:
  api:
    url: http://127.0.0.1:1

ocr:
  api:
    api-key: test-key
    prompt: "test prompt"

chatbot:
  api:
    api-key: test-key
    system-prompt: "You are a test assistant. Today is {today}. Currency: {currency}."


# Currencies fallback (used when remote API is unavailable)
currencies:
  USD: "United States Dollar"
  EUR: "Euro"
  GBP: "British Pound"
  SGD: "Singapore Dollar"
  JPY: "Japanese Yen"
  AUD: "Australian Dollar"
  CHF: "Swiss Franc"
  CNY: "Chinese Renminbi Yuan"
  CAD: "Canadian Dollar"
  HKD: "Hong Kong Dollar"

