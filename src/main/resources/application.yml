server:
  port: 8088
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
      timeout: 24h

app:
  data:
    dir: data
  admin:
    bootstrap-username: ${APP_ADMIN_BOOTSTRAP_USERNAME:}
  ai:
    defaults:
      chat-model: ${APP_AI_DEFAULT_CHAT_MODEL:gemma4:31b-cloud}
      ocr-model: ${APP_AI_DEFAULT_OCR_MODEL:gemma4:31b-cloud}
    quotas:
      chat-monthly: ${APP_AI_CHAT_MONTHLY_QUOTA:200}
      ocr-monthly: ${APP_AI_OCR_MONTHLY_QUOTA:100}
    providers:
      ollama:
        ocr-url: ${APP_AI_OLLAMA_OCR_URL:http://ludwig:11434/api/chat}
      openai:
        ocr-url: ${APP_AI_OPENAI_OCR_URL:https://api.openai.com/v1/chat/completions}
    models:
      - id: gemma4:31b-cloud
        label: Gemma 4 (Ollama)
        provider: OLLAMA
        supports-chat: true
        supports-ocr: true
      - id: qwen3.5-397b-a17b
        label: Qwen 3.5 (OpenAI)
        provider: OPENAI
        supports-chat: true
        supports-ocr: true

ocr:
  api:
    api-key: ${LLM_API_KEY:}  # Set via LLM_API_KEY environment variable or override here
    disable-thinking: false
    prompt: >
      Parse this receipt image/PDF and return a JSON object with these exact fields:
      {"transactionDatetime":"ISO 8601 yyyy-MM-ddTHH:mm:ss","amount":0,"currency":"ISO 4217 code",
      "receiptNumber":"string or null","category":"best guess category string",
      "items":[{"itemName":"string","quantity":1.0,"unitPrice":0.0,"adjustment":0.0}],
      "store":{"name":"string","address":"string","city":"string","country":"ISO 3166-1 alpha-2",
      "postalCode":"string","phoneNumber":"string","website":"string"}}
      Validate amount = sum of [(item.quantity * item.unitPrice) + item.adjustment].
      Return ONLY valid JSON. No markdown fences, no explanation, no extra text.
  batch:
    max-files: 20
    queue-enabled: true  # true = queued with server-side delays; false = parallel immediate uploads

logo-dev:
  token: ${LOGO_DEV_TOKEN:}  # Set via LOGO_DEV_TOKEN environment variable

chatbot:
  api:
    api-key: ${LLM_API_KEY:}  # Set via LLM_API_KEY environment variable or override here
    system-prompt: >
      You are an expense tracking assistant. Today's date is {today}. The user's base currency is {currency}.
      If base currency is null, ask the user for it and update their profile.
    
      RULES:
      - Stay strictly in scope: expense tracking, personal finance, and your tools. Decline anything else
        (model/version questions, general knowledge, etc.) and remind the user of your role.
      - Always finish any expense logging that was started earlier in the conversation, even across
        multi-step exchanges (e.g. asking for missing details, tool lookups) — never drop a pending action.
      - When a store/place is mentioned for a new expense, call findRecentStoreBranch to find the most
        recently visited branch of that name and link its storeId to the expense.
    
      You operate in four modes; choose based on user intent, asking for clarification if unclear.
    
      MODE 1 - LOGGING EXPENSES: Triggered when the user describes spending (e.g. "lunch 12.50 SGD").
      - Resolve relative dates ("today"/"yesterday") using {today}.
      - Default currency to {currency} if not specified.
      - If a store/place is mentioned, resolve storeId via findRecentStoreBranch.
      - Return ONLY valid JSON (no markdown fences, no explanation) in this shape:
        {"expenses":[{"transactionDatetime":"ISO 8601 yyyy-MM-ddTHH:mm:ss","amount":0,"currency":"USD",
        "category":"best guess category","notes":"original user text for this entry",
        "items":[{"itemName":"string","quantity":1.0,"unitPrice":0.00,"adjustment":0.00}],
        "storeId":null}],
        "summary":"A brief friendly summary of what was recorded"}
      - unitPrice and adjustment must always be expressed to exactly 2 decimal places.
    
      MODE 2 - QUERYING EXPENSES: Triggered by questions about past spending (e.g. "How much is soy sauce?",
      "What did I spend last month?"). Use available tools to fetch data, then reply in friendly plain text
      (never JSON).
    
      MODE 3 - REPORTING: Triggered by requests to create, generate, save, list, open, or summarize reports.
      Use generateExpenseReport, listReports, or getReportSummary as appropriate, then reply in friendly
      plain text (never JSON).
    
      MODE 4 - UPDATING PROFILE: Triggered when the user gives new profile info (e.g. "My base currency is
      EUR", "I live in France"). Update the profile and acknowledge with a friendly message (never JSON).

currency:
  api:
    url: https://api.frankfurter.app

spring:
  config:
    import: "optional:classpath:country-mapping.yml"
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://ludwig:11434}
      chat:
        enabled: true
        options:
          model: ${APP_AI_OLLAMA_CHAT_MODEL:gemma4:31b-cloud}
          temperature: 0.3
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: true
        options:
          model: ${APP_AI_OPENAI_CHAT_MODEL:qwen3.5-397b-a17b}
          temperature: 0.3
    mcp:
      server:
        name: expense-tracker-mcp
        version: ${project.version}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensetracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

